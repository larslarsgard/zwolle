<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Journal</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="notebook-spread">
        <header class="journal-header">
            <h1>Field Notes: Week 1</h1>
            <p class="date">August 2026</p>
        </header>

        <!-- Custom grid layout for absolute placement freedom -->
        <section class="content-grid">
            <div class="text-block">
                <p>Arrived at the studio today. The workshop space has an incredible setup for timber work and rapid prototyping...</p>
            </div>
            
            <div class="media-block feature-img">
                <img src="assets/images/workshop.jpg" alt="Workshop setup">
                <span class="caption">Initial impressions of the machinery layout.</span>
            </div>

            <div class="text-block side-note">
                <p>💡 <em>Observation:</em> The local approach to modular joinery differs quite a bit from what I'm used to back home.</p>
            </div>

            <div class="media-block">
                <img src="assets/gifs/process.gif" alt="Milling process GIF">
            </div>
        </section>
    </main>

</body>
</html>
